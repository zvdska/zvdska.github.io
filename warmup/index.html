<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>WARMUP</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { --dark:#080404; --ink:#fff; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; }
  body { background:var(--dark); color:var(--ink); font-family:-apple-system,sans-serif; overflow:hidden; -webkit-font-smoothing:antialiased; }

  /* фон — сильно размытая обложка, даёт красное свечение */
  .bg { position:fixed; inset:-12%; background-image:var(--img); background-size:cover; background-position:center;
    filter:blur(60px) brightness(.5) saturate(1.15); transform:scale(1.15); z-index:0;
    opacity:0; transition:opacity 1.4s ease; }
  .bg.show { opacity:1; }
  .bg-shade { position:fixed; inset:0; background:radial-gradient(120% 90% at 50% 32%, rgba(0,0,0,.25) 0%, rgba(0,0,0,.72) 100%); z-index:1; pointer-events:none; }

  .wrap { position:fixed; inset:0; z-index:3; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; }

  .stage { flex:none; display:flex; align-items:center; justify-content:center; width:100%;
    padding:calc(env(safe-area-inset-top) + 9vh) 24px 0; }

  /* ОБЛОЖКА: выезжает снизу + глитч */
  .cover { position:relative; width:min(74vw,340px); aspect-ratio:1; border-radius:22px; overflow:hidden;
    isolation:isolate;
    /* Safari/iOS перестаёт обрезать углы, когда внутри анимируются трансформы — держим маской */
    -webkit-mask-image:-webkit-radial-gradient(#fff, #000);
    mask-image:radial-gradient(#fff, #000);
    will-change:transform, opacity;
    --s:.96; --ty:60px; --rx:0deg; --ry:0deg;
    opacity:0;
    transform:perspective(900px) rotateX(var(--rx)) rotateY(var(--ry)) translateY(var(--ty)) scale(var(--s));
    transition:opacity .55s ease, transform .95s cubic-bezier(.16,.9,.24,1); }
  .cover.show { opacity:1; --ty:0px; --s:1; }
  .cover.live { transition:opacity .55s ease, transform .28s cubic-bezier(.22,.9,.3,1); }

  .cover img { width:100%; height:100%; object-fit:cover; display:block; border-radius:inherit; }

  /* слои хроматического разлёта */
  .g { position:absolute; inset:0; background-image:var(--img); background-size:cover; background-position:center;
    border-radius:inherit; mix-blend-mode:screen; opacity:0; pointer-events:none; }
  .g1 { filter:sepia(1) hue-rotate(-38deg) saturate(7) brightness(1.1); }
  .g2 { filter:sepia(1) hue-rotate(150deg) saturate(6) brightness(1.05); }

  /* строчная развёртка поверх */
  .scan { position:absolute; inset:0; border-radius:inherit; pointer-events:none; opacity:0;
    background:repeating-linear-gradient(to bottom, rgba(0,0,0,.5) 0 1px, rgba(0,0,0,0) 1px 3px); }

  @keyframes gA {
    0%   { opacity:0;  transform:translateX(0);    clip-path:inset(0 0 100% 0); }
    6%   { opacity:.95; transform:translateX(-14px); clip-path:inset(6% 0 66% 0); }
    13%  { opacity:.9;  transform:translateX(11px);  clip-path:inset(41% 0 34% 0); }
    21%  { opacity:.85; transform:translateX(-9px);  clip-path:inset(72% 0 9% 0); }
    30%  { opacity:.8;  transform:translateX(7px);   clip-path:inset(18% 0 58% 0); }
    41%  { opacity:.6;  transform:translateX(-5px);  clip-path:inset(55% 0 26% 0); }
    54%  { opacity:.45; transform:translateX(4px);   clip-path:inset(4% 0 82% 0); }
    68%  { opacity:.25; transform:translateX(-2px);  clip-path:inset(63% 0 21% 0); }
    100% { opacity:0;  transform:translateX(0);    clip-path:inset(0 0 100% 0); }
  }
  @keyframes gB {
    0%   { opacity:0;  transform:translateX(0);    clip-path:inset(0 0 100% 0); }
    8%   { opacity:.9;  transform:translateX(13px);  clip-path:inset(28% 0 48% 0); }
    17%  { opacity:.85; transform:translateX(-10px); clip-path:inset(60% 0 22% 0); }
    26%  { opacity:.8;  transform:translateX(8px);   clip-path:inset(9% 0 74% 0); }
    37%  { opacity:.65; transform:translateX(-6px);  clip-path:inset(47% 0 38% 0); }
    50%  { opacity:.45; transform:translateX(4px);   clip-path:inset(76% 0 8% 0); }
    64%  { opacity:.2;  transform:translateX(-2px);  clip-path:inset(33% 0 55% 0); }
    100% { opacity:0;  transform:translateX(0);    clip-path:inset(0 0 100% 0); }
  }
  /* рывки самой картинки — будто кадр срывается */
  @keyframes baseJit {
    0%,100% { transform:translate(0,0); filter:none; }
    7%   { transform:translate(-6px,2px); filter:contrast(1.5) brightness(1.25); }
    14%  { transform:translate(5px,-2px); filter:none; }
    23%  { transform:translate(-3px,0);   filter:contrast(1.3) brightness(.8); }
    34%  { transform:translate(4px,1px);  filter:none; }
    48%  { transform:translate(-2px,0);   filter:brightness(1.15); }
    62%  { transform:translate(1px,0);    filter:none; }
  }
  @keyframes scanFlick {
    0%   { opacity:0; }
    10%  { opacity:.55; }
    35%  { opacity:.3; }
    60%  { opacity:.42; }
    100% { opacity:0; }
  }

  .cover.show .g1   { animation:gA 1.25s steps(1,end) both, gA .45s steps(1,end) 2.1s both; }
  .cover.show .g2   { animation:gB 1.25s steps(1,end) both, gB .45s steps(1,end) 2.1s both; }
  .cover.show img   { animation:baseJit 1.05s steps(1,end) both, baseJit .4s steps(1,end) 2.1s both; }
  .cover.show .scan { animation:scanFlick 1.3s linear both, scanFlick .5s linear 2.1s both; }

  /* НАДПИСЬ: проступает как дым */
  .mark { position:relative; flex:none; width:min(72vw,330px); margin-top:7vh;
    display:flex; align-items:center; justify-content:center; }
  .mark img { width:100%; display:block; }
  .mark-main { opacity:0; filter:blur(92px); transform:translateY(30px) scale(1.1);
    transition:opacity 2.4s ease, filter 3.2s cubic-bezier(.2,.7,.25,1), transform 3.2s cubic-bezier(.2,.7,.25,1); }
  .mark.show .mark-main { opacity:1; filter:blur(0); transform:none; }

  /* кнопки площадок */
  .platforms-zone { flex:1; display:flex; align-items:center; justify-content:center; width:100%;
    padding:20px 0 calc(env(safe-area-inset-bottom) + 20px); }
  .platforms { display:flex; flex-direction:row; align-items:center; justify-content:center; gap:10px; width:100%; padding:0 16px;
    opacity:0; transform:translateY(18px); transition:opacity .7s ease, transform .7s cubic-bezier(.22,.9,.3,1); }
  .platforms.show { opacity:1; transform:none; }
  .pbtn { flex:1; max-width:33%; cursor:pointer; position:relative; display:block;
    transition:transform .15s, opacity .2s; }
  .pbtn img { width:100%; display:block; }
  .pbtn:active { transform:scale(.94); opacity:.8; }
  .pbtn.p-apple { transition-delay:0s; } .pbtn.p-spotify { transition-delay:.05s; } .pbtn.p-youtube { transition-delay:.1s; }

  @media (min-width: 768px) {
    .stage { padding:7vh 40px 0; }
    .cover { width:min(52vh,400px); border-radius:26px; }
    .mark { width:min(50vh,380px); margin-top:5vh; }
    .platforms { max-width:440px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .cover, .platforms { transition:none; opacity:1; transform:none; }
    .mark-main { transition:none; opacity:1; filter:none; transform:none; }
    .cover.show .g1, .cover.show .g2, .cover.show img, .cover.show .scan { animation:none; }
  }
</style>
</head>

<script>
  const tg = window.Telegram?.WebApp;
  if (tg) { tg.ready(); tg.expand(); tg.setHeaderColor('#080404'); tg.setBackgroundColor('#080404'); }

  const cover = document.getElementById('cover');
  const bg = document.getElementById('bg');
  const platforms = document.getElementById('platforms');

  // обложку используем и как фон — один и тот же файл, второй раз не грузится
  const imgUrl = 'url("' + cover.querySelector('img').src + '")';
  bg.style.setProperty('--img', imgUrl);
  cover.style.setProperty('--img', imgUrl);

  setTimeout(() => { bg.classList.add('show'); cover.classList.add('show'); }, 900);  // выезд + глитч
  const mark = document.getElementById('mark');
  setTimeout(() => { mark.classList.add('show'); }, 1800);                            // надпись проступает
  setTimeout(() => platforms.classList.add('show'), 3600);                            // кнопки

  // наклон обложки за курсором (только ПК)
  if (window.matchMedia('(hover:hover) and (pointer:fine)').matches) {
    const MAX = 9;
    let raf = null, tx = 0, ty = 0;
    const apply = () => {
      raf = null;
      cover.style.setProperty('--ry', tx.toFixed(2) + 'deg');
      cover.style.setProperty('--rx', ty.toFixed(2) + 'deg');
    };
    window.addEventListener('mousemove', (e) => {
      const r = cover.getBoundingClientRect();
      if (!r.width) return;
      const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      const nx = Math.max(-1, Math.min(1, (e.clientX - cx) / (r.width  * 1.6)));
      const ny = Math.max(-1, Math.min(1, (e.clientY - cy) / (r.height * 1.6)));
      tx = nx * MAX; ty = -ny * MAX;
      if (!raf) raf = requestAnimationFrame(apply);
    }, { passive:true });
    document.addEventListener('mouseleave', () => { tx = ty = 0; if (!raf) raf = requestAnimationFrame(apply); });
    setTimeout(() => cover.classList.add('live'), 2800);
  }

  // === учёт кликов TYRAZH ===
  const TRACK_SLUG = "warmup";
  const CLICK_ENDPOINT = "https://ktfmjaanheowyzjrovkc.supabase.co/functions/v1/track-click";
  function logClick(platform) {
    const body = JSON.stringify({ slug: TRACK_SLUG, platform });
    try { return fetch(CLICK_ENDPOINT, { method:"POST", headers:{"content-type":"application/json"}, body, keepalive:true }).catch(()=>{}); }
    catch (_) { return Promise.resolve(); }
  }

  function openUrl(el) {
    const url = el.dataset.url, p = el.dataset.p;
    tg?.HapticFeedback?.impactOccurred('light');
    let done = false;
    const go = () => { if (done) return; done = true; if (!url || url === '#') return; tg ? tg.openLink(url) : window.open(url,'_blank'); };
    if (tg) { if (p) logClick(p); go(); }
    else if (p) { logClick(p).finally(go); setTimeout(go, 500); }
    else { go(); }
  }
  document.querySelectorAll('[data-url]').forEach(el => el.addEventListener('click', () => openUrl(el)));
</script>
