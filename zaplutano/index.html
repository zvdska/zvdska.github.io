<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>все заплутано</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { --ink:#11141a; --paper:#f4f5f8; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; }
  body { color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    overflow:hidden; -webkit-font-smoothing:antialiased;
    background:
      radial-gradient(135% 95% at 50% 16%, #ffffff 0%, #f4f5f8 46%, #e7e9ef 100%);
    background-attachment:fixed; }

  .wrap { position:fixed; inset:0; z-index:2; display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    padding:calc(env(safe-area-inset-top) + 8px) 0 calc(env(safe-area-inset-bottom) + 8px); }

  /* --- секвенция вместо обложки --- */
  .stage { flex:none; display:flex; align-items:center; justify-content:center; width:100%; padding:0; }
  .seq { position:relative; width:min(104vw,500px,60vh); aspect-ratio:1;
    will-change:transform, opacity;
    opacity:0; --s:.96; --rx:0deg; --ry:0deg;
    transform:perspective(1000px) rotateX(var(--rx)) rotateY(var(--ry)) scale(var(--s));
    transition:opacity 1s ease, transform 1.1s cubic-bezier(.22,.9,.3,1); }
  .seq.show { opacity:1; --s:1; }
  .seq.live { transition:opacity 1s ease, transform .28s cubic-bezier(.22,.9,.3,1); }
  .seq canvas, .seq .poster { position:absolute; inset:0; width:100%; height:100%;
    display:block; object-fit:contain; }
  .seq canvas { opacity:0; transition:opacity .45s ease; }
  .seq.playing canvas { opacity:1; }
  .seq.playing .poster { opacity:0; }
  .seq .poster { opacity:1; transition:opacity .45s ease; }

  /* --- площадки --- */
  .platforms-zone { flex:none; display:flex; align-items:center; justify-content:center; width:100%;
    padding:3.5vh 0 0; }
  .platforms { display:flex; align-items:center; justify-content:center;
    gap:min(8vw,38px); width:100%; padding:0 22px;
    opacity:0; transform:translateY(16px);
    transition:opacity .8s ease, transform .8s cubic-bezier(.22,.9,.3,1); }
  .platforms.show { opacity:1; transform:none; }
  .pbtn { cursor:pointer; display:flex; align-items:center; justify-content:center;
    padding:10px 2px; transition:transform .16s ease, opacity .2s ease; }
  .pbtn img { height:21px; width:auto; display:block; }
  .pbtn.p-spotify img { height:23px; }
  .pbtn:active { transform:scale(.93); opacity:.55; }
  .pbtn.p-apple { transition-delay:0s; }
  .pbtn.p-spotify { transition-delay:.06s; }
  .pbtn.p-youtube { transition-delay:.12s; }

  @media (min-width: 768px) {
    .seq { width:min(62vh,520px); }
    .platforms-zone { padding:3vh 0 0; }
    .platforms { max-width:560px; gap:48px; }
    .pbtn img { height:25px; }
    .pbtn.p-spotify img { height:27px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .seq,.platforms { transition:none; opacity:1; transform:none; }
  }
</style>
</head>

<script>
  const tg = window.Telegram?.WebApp;
  if (tg) { tg.ready(); tg.expand(); tg.setHeaderColor('#f4f5f8'); tg.setBackgroundColor('#f4f5f8'); }

  /* ============================================================
     НАСТРОЙКИ СЕКВЕНЦИИ
     Кадры лежат рядом с index.html в папке seq:
       seq/0001.webp, seq/0002.webp, ... seq/0100.webp
     Если имена другие — поменяй dir / prefix / pad / ext.
     ============================================================ */
  const SEQ = {
    dir: 'seq',      // папка с кадрами
    prefix: '',      // префикс имени, например 'frame_'
    pad: 4,          // 0001 -> 4, 001 -> 3, 1 -> 0
    ext: 'webp',
    frames: 100,     // сколько кадров
    fps: 25,         // 100 кадров / 25 fps = 4 c на цикл
    loop: true,
    startAt: 24      // старт, когда подгружено столько кадров
  };

  const seqEl = document.getElementById('seq');
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const platforms = document.getElementById('platforms');

  const frameUrl = i => SEQ.dir + '/' + SEQ.prefix + String(i + 1).padStart(SEQ.pad, '0') + '.' + SEQ.ext;

  const imgs = new Array(SEQ.frames).fill(null);
  let ready = 0, failed = 0, started = false;

  function fitCanvas() {
    const r = seqEl.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    cv.width  = Math.max(1, Math.round(r.width  * dpr));
    cv.height = Math.max(1, Math.round(r.height * dpr));
  }

  function draw(img) {
    if (!img) return;
    ctx.clearRect(0, 0, cv.width, cv.height);
    // вписываем кадр целиком, сохраняя пропорции
    const s = Math.min(cv.width / img.naturalWidth, cv.height / img.naturalHeight);
    const w = img.naturalWidth * s, h = img.naturalHeight * s;
    ctx.drawImage(img, (cv.width - w) / 2, (cv.height - h) / 2, w, h);
  }

  let cur = 0, acc = 0, last = 0, raf = null;
  function tick(t) {
    raf = requestAnimationFrame(tick);
    if (!last) { last = t; return; }
    acc += t - last; last = t;
    const step = 1000 / SEQ.fps;
    if (acc < step) return;
    const advance = Math.floor(acc / step);
    acc -= advance * step;
    let n = cur + advance;
    if (n >= SEQ.frames) {
      if (!SEQ.loop) { n = SEQ.frames - 1; cancelAnimationFrame(raf); raf = null; }
      else n = n % SEQ.frames;
    }
    cur = n;
    draw(imgs[cur] || imgs.find(Boolean));
  }

  function startPlayback() {
    if (started) return;
    started = true;
    fitCanvas();
    draw(imgs[0] || imgs.find(Boolean));
    seqEl.classList.add('playing');
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    last = 0; acc = 0;
    raf = requestAnimationFrame(tick);
  }

  // грузим кадры, стартуем как только набралось достаточно
  for (let i = 0; i < SEQ.frames; i++) {
    const im = new Image();
    im.decoding = 'async';
    im.onload = () => {
      imgs[i] = im; ready++;
      if (!started && ready >= Math.min(SEQ.startAt, SEQ.frames - failed)) startPlayback();
    };
    im.onerror = () => {
      failed++;
      // нет папки seq — остаёмся на статичном кадре-постере
      if (failed >= SEQ.frames) seqEl.classList.remove('playing');
    };
    im.src = frameUrl(i);
  }

  let rt = null;
  window.addEventListener('resize', () => {
    clearTimeout(rt);
    rt = setTimeout(() => { if (started) { fitCanvas(); draw(imgs[cur] || imgs.find(Boolean)); } }, 150);
  });

  // появление
  setTimeout(() => seqEl.classList.add('show'), 500);
  setTimeout(() => platforms.classList.add('show'), 1500);

  // === наклон за курсором (только ПК) ===
  if (window.matchMedia('(hover:hover) and (pointer:fine)').matches) {
    const MAX = 8;
    let r2 = null, tx = 0, ty = 0;
    const apply = () => {
      r2 = null;
      seqEl.style.setProperty('--ry', tx.toFixed(2) + 'deg');
      seqEl.style.setProperty('--rx', ty.toFixed(2) + 'deg');
    };
    window.addEventListener('mousemove', (e) => {
      const r = seqEl.getBoundingClientRect();
      if (!r.width) return;
      const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      const nx = Math.max(-1, Math.min(1, (e.clientX - cx) / (r.width  * 1.6)));
      const ny = Math.max(-1, Math.min(1, (e.clientY - cy) / (r.height * 1.6)));
      tx = nx * MAX; ty = -ny * MAX;
      if (!r2) r2 = requestAnimationFrame(apply);
    }, { passive:true });
    document.addEventListener('mouseleave', () => {
      tx = ty = 0; if (!r2) r2 = requestAnimationFrame(apply);
    });
    setTimeout(() => seqEl.classList.add('live'), 1700);
  }

  // === учёт кликов TYRAZH ===
  const TRACK_SLUG = "vse-zaplutano";
  const CLICK_ENDPOINT = "https://ktfmjaanheowyzjrovkc.supabase.co/functions/v1/track-click";
  function logClick(platform) {
    const body = JSON.stringify({ slug: TRACK_SLUG, platform });
    try { return fetch(CLICK_ENDPOINT, { method:"POST", headers:{"content-type":"application/json"}, body, keepalive:true }).catch(()=>{}); }
    catch (_) { return Promise.resolve(); }
  }

  function openUrl(el) {
    const url = el.dataset.url, p = el.dataset.p;
    tg?.HapticFeedback?.impactOccurred('light');
    let done = false;
    const go = () => { if (done) return; done = true; if (!url || url === '#') return; tg ? tg.openLink(url) : window.open(url,'_blank'); };
    if (tg) { if (p) logClick(p); go(); }
    else if (p) { logClick(p).finally(go); setTimeout(go, 500); }
    else { go(); }
  }
  document.querySelectorAll('[data-url]').forEach(el => el.addEventListener('click', () => openUrl(el)));
</script>
