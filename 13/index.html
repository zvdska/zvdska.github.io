<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>KRBK — Записка 13</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { --ink:#ffffff; --road:#000000; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; }
  body { color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    overflow:hidden; -webkit-font-smoothing:antialiased; background:var(--road); }


  .wrap { position:fixed; inset:0; z-index:2; display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    padding:calc(env(safe-area-inset-top) + 8px) 0 calc(env(safe-area-inset-bottom) + 8px); }

  /* --- обложка: 100 кадров, зациклено --- */
  .stage { flex:none; display:flex; align-items:center; justify-content:center; width:100%; padding:0; }
  .seq { position:relative; width:min(122vw,580px,70vh); aspect-ratio:1;
    /* у кадра по 18% прозрачного поля с каждой стороны — подтягиваем кнопки к плите */
    margin-bottom:-6%;
    will-change:transform, opacity;
    opacity:0; --s:.96; --rx:0deg; --ry:0deg;
    transform:perspective(1000px) rotateX(var(--rx)) rotateY(var(--ry)) scale(var(--s));
    transition:opacity 1s ease, transform 1.1s cubic-bezier(.22,.9,.3,1); }
  .seq.show { opacity:1; --s:1; }
  .seq.live { transition:opacity 1s ease, transform .28s cubic-bezier(.22,.9,.3,1); }

  /* видео свёрстано на чёрном — вырезаем плиту маской, снятой с самой секвенции,
     иначе на асфальте был бы виден чёрный квадрат */
  .seq video, .seq .poster { position:absolute; inset:0; width:100%; height:100%;
    display:block; object-fit:cover; }
  .seq video { opacity:0; transition:opacity .4s ease; }
  .seq.playing video { opacity:1; }
  .seq.playing .poster { opacity:0; }
  .seq .poster { opacity:1; transition:opacity .4s ease; }

  /* --- площадки --- */
  .platforms-zone { flex:none; display:flex; align-items:center; justify-content:center; width:100%;
    padding:2.5vh 0 0; }
  .platforms { display:flex; align-items:center; justify-content:center;
    gap:min(8vw,38px); width:100%; padding:0 22px;
    opacity:0; transform:translateY(16px);
    transition:opacity .8s ease, transform .8s cubic-bezier(.22,.9,.3,1); }
  .platforms.show { opacity:1; transform:none; }
  .pbtn { cursor:pointer; display:flex; align-items:center; justify-content:center;
    padding:10px 2px; transition:transform .16s ease, opacity .2s ease; }
  .pbtn img { height:21px; width:auto; display:block; }
  .pbtn.p-spotify img { height:23px; }
  .pbtn:active { transform:scale(.93); opacity:.55; }
  .pbtn.p-apple { transition-delay:0s; }
  .pbtn.p-spotify { transition-delay:.06s; }
  .pbtn.p-youtube { transition-delay:.12s; }

  @media (min-width: 768px) {
    .seq { width:min(70vh,580px); }
    .platforms-zone { padding:2vh 0 0; }
    .platforms { max-width:560px; gap:48px; }
    .pbtn img { height:25px; }
    .pbtn.p-spotify img { height:27px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .seq,.platforms { transition:none; opacity:1; transform:none; }
  }
</style>

<script>
  const tg = window.Telegram?.WebApp;
  if (tg) { tg.ready(); tg.expand(); tg.setHeaderColor('#000000'); tg.setBackgroundColor('#000000'); }

  const seqEl = document.getElementById('seq');
  const vid = document.getElementById('vid');
  const platforms = document.getElementById('platforms');

  vid.muted = true; vid.defaultMuted = true;
  const kick = () => vid.play?.().catch(()=>{});
  kick();
  window.addEventListener('load', kick);
  document.addEventListener('touchstart', kick, { once:true });
  const reveal = () => seqEl.classList.add('playing');
  if (vid.readyState >= 2) reveal();
  vid.addEventListener('loadeddata', reveal);
  vid.addEventListener('playing', reveal);

  setTimeout(() => seqEl.classList.add('show'), 400);
  setTimeout(() => platforms.classList.add('show'), 1400);

  // === наклон за курсором (только ПК) ===
  if (window.matchMedia('(hover:hover) and (pointer:fine)').matches) {
    const MAX = 8;
    let raf = null, tx = 0, ty = 0;
    const apply = () => {
      raf = null;
      seqEl.style.setProperty('--ry', tx.toFixed(2) + 'deg');
      seqEl.style.setProperty('--rx', ty.toFixed(2) + 'deg');
    };
    window.addEventListener('mousemove', (e) => {
      const r = seqEl.getBoundingClientRect();
      if (!r.width) return;
      const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      const nx = Math.max(-1, Math.min(1, (e.clientX - cx) / (r.width  * 1.6)));
      const ny = Math.max(-1, Math.min(1, (e.clientY - cy) / (r.height * 1.6)));
      tx = nx * MAX; ty = -ny * MAX;
      if (!raf) raf = requestAnimationFrame(apply);
    }, { passive:true });
    document.addEventListener('mouseleave', () => {
      tx = ty = 0; if (!raf) raf = requestAnimationFrame(apply);
    });
    setTimeout(() => seqEl.classList.add('live'), 1600);
  }

  // === учёт кликов TYRAZH ===
  const TRACK_SLUG = "kz-13";
  const CLICK_ENDPOINT = "https://ktfmjaanheowyzjrovkc.supabase.co/functions/v1/track-click";
  function logClick(platform) {
    const body = JSON.stringify({ slug: TRACK_SLUG, platform });
    try { return fetch(CLICK_ENDPOINT, { method:"POST", headers:{"content-type":"application/json"}, body, keepalive:true }).catch(()=>{}); }
    catch (_) { return Promise.resolve(); }
  }

  function openUrl(el) {
    const url = el.dataset.url, p = el.dataset.p;
    tg?.HapticFeedback?.impactOccurred('light');
    let done = false;
    const go = () => { if (done) return; done = true; if (!url || url === '#') return; tg ? tg.openLink(url) : window.open(url,'_blank'); };
    if (tg) { if (p) logClick(p); go(); }
    else if (p) { logClick(p).finally(go); setTimeout(go, 500); }
    else { go(); }
  }
  document.querySelectorAll('[data-url]').forEach(el => el.addEventListener('click', () => openUrl(el)));
</script>
