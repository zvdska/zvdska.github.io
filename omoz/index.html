<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ORLANDO MAGIC &mdash; ОПЯТЬ ЗИМА</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { --ink:#FFFFFF; --dark:#050607; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; }
  body { background:var(--dark); color:var(--ink); font-family:-apple-system,sans-serif; overflow:hidden; -webkit-font-smoothing:antialiased; }

  /* тёмная версия арта на весь экран */
  .bg { position:fixed; inset:0; width:100%; height:100%; object-fit:cover;
    transform:scale(1.03); transform-origin:50% 45%;
    filter:brightness(1) saturate(1.02); z-index:0;
    transition:filter 1.8s ease, transform 18s ease-out; }
  .bg.drift { transform:scale(1.09); }
  .bg.blur { filter:brightness(.82) saturate(1.02) blur(5px); }

  /* холодная виньетка */
  .bg-shade { position:fixed; inset:0; z-index:1; pointer-events:none;
    background:
      radial-gradient(125% 85% at 50% 30%, rgba(8,24,34,.10) 0%, rgba(5,6,7,.22) 58%, rgba(5,6,7,.62) 100%); }

  .wrap { position:fixed; inset:0; z-index:3; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; padding:0; }

  .stage { flex:none; display:flex; align-items:center; justify-content:center; width:100%;
    padding:calc(env(safe-area-inset-top) + 9vh) 24px 0; }

  /* обложка — всегда с закруглёнными краями */
  .cover { position:relative; width:min(74vw,340px); aspect-ratio:1;
    border-radius:26px; overflow:hidden;
    isolation:isolate;
    -webkit-mask-image:-webkit-radial-gradient(#fff, #000);
    mask-image:radial-gradient(#fff, #000);
    will-change:transform, opacity;
    opacity:0; --s:.94; --ty:22px; --rx:0deg; --ry:0deg;
    transform:perspective(900px) rotateX(var(--rx)) rotateY(var(--ry)) translateY(var(--ty)) scale(var(--s));
    transition:opacity 1.1s ease, transform 1.1s cubic-bezier(.22,.9,.3,1); }
  .cover.show { opacity:1; --s:1; --ty:0px; }
  /* после появления наклон догоняет курсор быстро */
  .cover.live { transition:opacity 1.1s ease, transform .28s cubic-bezier(.22,.9,.3,1); }
  .cover img { width:100%; height:100%; display:block; object-fit:cover; border-radius:inherit; }

  /* кнопки площадок */
  .platforms-zone { flex:1; display:flex; align-items:center; justify-content:center; width:100%;
    padding:20px 0 calc(env(safe-area-inset-bottom) + 20px); }
  .platforms { display:flex; flex-direction:row; align-items:center; justify-content:center; gap:10px; width:100%; padding:0 16px;
    opacity:0; transform:translateY(18px); transition:opacity .7s ease, transform .7s cubic-bezier(.22,.9,.3,1); }
  .platforms.show { opacity:1; transform:none; }
  .pbtn { flex:1; max-width:33%; cursor:pointer; position:relative; display:block;
    transition:transform .15s, opacity .2s; }
  .pbtn img { width:100%; display:block; }
  .pbtn:active { transform:scale(.94); opacity:.8; }
  .pbtn.p-apple { transition-delay:0s; } .pbtn.p-spotify { transition-delay:.05s; } .pbtn.p-youtube { transition-delay:.1s; }

  /* ПК */
  @media (min-width: 768px) {
    .stage { padding:7vh 40px 0; }
    .cover { width:min(52vh,400px); }
    .platforms { max-width:440px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .cover,.platforms { transition:none; opacity:1; transform:none; }
    .bg { transition:none; transform:scale(1.03); }
  }
</style>
</head>

<script>
  const tg = window.Telegram?.WebApp;
  if (tg) { tg.ready(); tg.expand(); tg.setHeaderColor('#050607'); tg.setBackgroundColor('#050607'); }

  const bg = document.getElementById('bg');
  const cover = document.getElementById('cover');
  const platforms = document.getElementById('platforms');

  // медленный дрейф фона
  requestAnimationFrame(() => bg.classList.add('drift'));

  setTimeout(() => { cover.classList.add('show'); bg.classList.add('blur'); }, 1400);  // обложка + блюр фона
  setTimeout(() => platforms.classList.add('show'), 2500);                             // кнопки

  // === наклон обложки за курсором (только ПК) ===
  if (window.matchMedia('(hover:hover) and (pointer:fine)').matches) {
    const MAX = 9;
    let raf = null, tx = 0, ty = 0;
    const apply = () => {
      raf = null;
      cover.style.setProperty('--ry', tx.toFixed(2) + 'deg');
      cover.style.setProperty('--rx', ty.toFixed(2) + 'deg');
    };
    window.addEventListener('mousemove', (e) => {
      const r = cover.getBoundingClientRect();
      if (!r.width) return;
      const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      const nx = Math.max(-1, Math.min(1, (e.clientX - cx) / (r.width  * 1.6)));
      const ny = Math.max(-1, Math.min(1, (e.clientY - cy) / (r.height * 1.6)));
      tx =  nx * MAX;
      ty = -ny * MAX;
      if (!raf) raf = requestAnimationFrame(apply);
    }, { passive:true });
    document.addEventListener('mouseleave', () => {
      tx = ty = 0;
      if (!raf) raf = requestAnimationFrame(apply);
    });
    setTimeout(() => cover.classList.add('live'), 2600);
  }

  // === учёт кликов TYRAZH ===
  const TRACK_SLUG = "opyat-zima";
  const CLICK_ENDPOINT = "https://ktfmjaanheowyzjrovkc.supabase.co/functions/v1/track-click";
  function logClick(platform) {
    const body = JSON.stringify({ slug: TRACK_SLUG, platform });
    try { return fetch(CLICK_ENDPOINT, { method:"POST", headers:{"content-type":"application/json"}, body, keepalive:true }).catch(()=>{}); }
    catch (_) { return Promise.resolve(); }
  }

  function openUrl(el) {
    const url = el.dataset.url, p = el.dataset.p;
    tg?.HapticFeedback?.impactOccurred('light');
    let done = false;
    const go = () => { if (done) return; done = true; if (!url || url === '#') return; tg ? tg.openLink(url) : window.open(url,'_blank'); };
    if (tg) { if (p) logClick(p); go(); }
    else if (p) { logClick(p).finally(go); setTimeout(go, 500); }
    else { go(); }
  }
  document.querySelectorAll('[data-url]').forEach(el => el.addEventListener('click', () => openUrl(el)));
</script>
