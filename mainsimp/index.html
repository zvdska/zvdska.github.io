<style>
/* Manrope лежит в шопе — второй копии не держим */
@font-face{font-family:'Manrope';src:url('/shop/fonts/Manrope500-latin.woff2') format('woff2');font-weight:500;font-display:swap;
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+2000-206F,U+20A0-20CF,U+2122}
@font-face{font-family:'Manrope';src:url('/shop/fonts/Manrope500-cyrillic.woff2') format('woff2');font-weight:500;font-display:swap;
  unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
:root{
  --pad:clamp(16px,3vw,44px);
  --ui:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --ease:cubic-bezier(.2,.75,.15,1);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:#000;color:#fff}
body{font-family:var(--ui);-webkit-font-smoothing:antialiased;min-height:100svh}
a{color:inherit;text-decoration:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ── ЭКРАН ───────────────────────────────────────────────────
   Одна композиция на весь экран: фото, сверху меню, снизу кнопка
   на альбом и соцсети. Скроллить нечего. */
.hero{position:relative;min-height:100svh;display:flex;flex-direction:column;overflow:hidden;isolation:isolate}
.photo{position:absolute;inset:0;z-index:-2;width:100%;height:100%;object-fit:cover;
  object-position:46% 58%;opacity:0;animation:fade 1.6s ease .05s forwards}
/* затемнение сверху под меню и снизу под кнопку: фото серое и светлое,
   белому тексту на нём нужна подложка */
.hero::before{content:'';position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:linear-gradient(to bottom,
    rgba(0,0,0,.86) 0,rgba(0,0,0,.5) 13%,rgba(0,0,0,0) 30%,
    rgba(0,0,0,0) 56%,rgba(0,0,0,.6) 76%,rgba(0,0,0,.94) 100%)}

/* ── МЕНЮ ───────────────────────────────────────────────── */
.top{padding:calc(26px + env(safe-area-inset-top,0px)) var(--pad) 0}
.top nav{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;
  gap:14px clamp(22px,3.4vw,54px)}
.top a{position:relative;display:block;padding:8px 0;
  font:500 clamp(10.5px,.9vw,12.5px)/1 var(--ui);letter-spacing:.17em;text-transform:uppercase;
  color:rgba(255,255,255,.82);text-shadow:0 1px 12px rgba(0,0,0,.8);
  opacity:0;transform:translateY(-8px);animation:drop .9s var(--ease) forwards;
  transition:color .25s}
.top a:nth-child(1){animation-delay:.35s}
.top a:nth-child(2){animation-delay:.42s}
.top a:nth-child(3){animation-delay:.49s}
.top a:nth-child(4){animation-delay:.6s}
/* тонкая линия под пунктом при наведении */
.top a:not(.new)::after{content:'';position:absolute;left:0;right:0;bottom:1px;height:1px;background:#fff;
  transform:scaleX(0);transform-origin:left;transition:transform .3s var(--ease)}
@media (hover:hover){
  .top a:hover{color:#fff}
  .top a:not(.new):hover::after{transform:scaleX(1)}
  .top a.new:hover img{transform:scale(1.04)}
}
.top a:focus-visible{outline:2px solid #fff;outline-offset:4px}

/* новый альбом — логотип NEVER LAND из шопа, подпись под ним */
.top a.new{display:flex;flex-direction:column;align-items:center;gap:9px;padding:6px 0 4px}
.top a.new img{display:block;width:clamp(150px,13vw,210px);height:auto;
  filter:drop-shadow(0 2px 14px rgba(0,0,0,.85));transition:transform .35s var(--ease)}
.top a.new span{font:500 clamp(8.5px,.7vw,10px)/1 var(--ui);letter-spacing:.34em;text-indent:.34em;
  text-transform:uppercase;color:rgba(255,255,255,.62)}

/* ── НИЗ ────────────────────────────────────────────────── */
.bottom{margin-top:auto;display:flex;flex-direction:column;align-items:center;
  gap:clamp(20px,3.4vh,34px);padding:0 var(--pad) calc(26px + env(safe-area-inset-bottom,0px))}
.cta{display:inline-flex;align-items:center;justify-content:center;
  background:rgba(11,11,11,.72);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:999px;
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  padding:.95em 2.1em;font:500 clamp(11px,1vw,13px)/1 var(--ui);letter-spacing:.16em;text-transform:uppercase;
  opacity:0;transform:translateY(16px);animation:rise .9s var(--ease) .8s forwards;
  transition:background .25s,color .25s,border-color .25s}
@media (hover:hover){.cta:hover{background:#fff;color:#000;border-color:#fff}}
.cta:active{background:#fff;color:#000;border-color:#fff}
.cta:focus-visible{outline:2px solid #fff;outline-offset:5px}

.social{list-style:none;display:flex;gap:clamp(14px,1.8vw,26px);align-items:center;
  opacity:0;animation:fade 1s ease 1.05s forwards}
.social a{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;
  color:rgba(255,255,255,.85);filter:drop-shadow(0 2px 10px rgba(0,0,0,.85));transition:color .2s,background .2s}
.social a:hover{color:#000;background:#fff}
.social a:focus-visible{outline:2px solid #fff;outline-offset:2px}
.social svg{width:20px;height:20px;fill:currentColor}
.copy{font:500 clamp(9px,.72vw,10.5px)/1.8 var(--ui);letter-spacing:.17em;text-transform:uppercase;
  color:rgba(255,255,255,.6);text-shadow:0 1px 10px rgba(0,0,0,.95);
  opacity:0;animation:fade 1s ease 1.15s forwards}

@keyframes fade{to{opacity:1}}
@keyframes drop{to{opacity:1;transform:none}}
@keyframes rise{to{opacity:1;transform:none}}

/* телефон: три слова в ряд, логотип альбома — отдельной строкой ниже */
@media (max-width:640px){
  .top nav{gap:6px 22px}
  .top a.new{flex-basis:100%;margin-top:8px}
  .top a.new img{width:min(56vw,230px)}
  .photo{object-position:44% 60%}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-delay:0s!important}
}
