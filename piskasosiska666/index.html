<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEVERLAND</title>
<meta name="theme-color" content="#000000">

<style>
/* ── ШРИФТ ────────────────────────────────────────────────
   Google Sans не раздаётся публично. Положи .woff2 в /fonts/
   и он подхватится; пока файлов нет — берётся системный аналог. */
@font-face{font-family:'Google Sans';src:local('Google Sans'),local('Product Sans'),url('fonts/GoogleSans-Regular.woff2') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Google Sans';src:local('Google Sans Medium'),url('fonts/GoogleSans-Medium.woff2') format('woff2');font-weight:500;font-display:swap}
@font-face{font-family:'Google Sans';src:local('Google Sans Bold'),url('fonts/GoogleSans-Bold.woff2') format('woff2');font-weight:700;font-display:swap}

:root{
  --bg:#000; --fg:#fff;
  --dim:rgba(255,255,255,.42);
  --line:rgba(255,255,255,.13);
  --pad:clamp(20px,5vw,72px);
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:var(--bg); color:var(--fg);
  font-family:'Google Sans','Product Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
}

/* ── ЛОАДЕР ─────────────────────────────────────────────── */
#loader{
  position:fixed; inset:0; z-index:50; background:#000;
  display:grid; place-items:center;
  transition:opacity .7s ease; 
}
#loader.done{opacity:0; pointer-events:none}
#loader b{
  font-size:11px; font-weight:400; letter-spacing:.34em;
  color:var(--dim); font-variant-numeric:tabular-nums;
}

/* ── СЦЕНА ──────────────────────────────────────────────── */
#stage{position:relative; height:520vh}
#sticky{position:sticky; top:0; height:100svh; overflow:hidden}
#seq{position:absolute; inset:0; width:100%; height:100%}

#hint{
  position:absolute; left:50%; bottom:34px; translate:-50% 0; z-index:3;
  font-size:10px; letter-spacing:.32em; text-transform:uppercase;
  color:var(--dim); text-align:center;
}
#hint i{display:block; margin-top:9px; font-style:normal; animation:bob 2.2s ease-in-out infinite}
@keyframes bob{0%,100%{translate:0 0;opacity:.3}50%{translate:0 6px;opacity:1}}

/* ── NEVERLAND ──────────────────────────────────────────── */
#mark{
  position:absolute; inset:0; z-index:4;
  display:grid; place-content:center; align-content:center;
  padding:0 var(--pad);
  opacity:0; will-change:opacity,transform; pointer-events:none;
}
#mark svg{width:min(1080px,88vw); height:auto; overflow:visible; display:block}
#mark .cap{
  margin-top:26px; text-align:center;
  font-size:10px; letter-spacing:.36em; text-transform:uppercase; color:var(--dim);
}

/* ── МЕРЧ ───────────────────────────────────────────────── */
.merch{position:relative; z-index:5; background:var(--bg); padding:clamp(90px,15vh,170px) var(--pad) 0}
.head{
  display:flex; justify-content:space-between; align-items:baseline;
  gap:24px; flex-wrap:wrap; padding-bottom:26px; border-bottom:1px solid var(--line);
}
.head h2{font-size:clamp(30px,6vw,64px); font-weight:500; letter-spacing:-.025em}
.head p{font-size:10px; letter-spacing:.3em; text-transform:uppercase; color:var(--dim)}

.grid{
  display:grid; gap:1px; margin-top:1px; background:var(--line);
  grid-template-columns:repeat(auto-fill,minmax(255px,1fr));
}
.item{
  background:var(--bg); padding:20px 20px 24px; color:inherit; text-decoration:none;
  display:flex; flex-direction:column; gap:15px; transition:background .35s ease;
}
.item:hover{background:#090909}
.item:focus-visible{outline:1px solid #fff; outline-offset:-1px}
.shot{
  aspect-ratio:4/5; background:#0b0b0b; position:relative;
  display:grid; place-items:center; overflow:hidden;
}
.shot::after{content:'ФОТО'; font-size:9px; letter-spacing:.3em; color:rgba(255,255,255,.18)}
.shot img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
  transition:transform .7s cubic-bezier(.2,.7,.2,1)}
.item:hover .shot img{transform:scale(1.045)}
.row{display:flex; justify-content:space-between; align-items:baseline; gap:12px}
.row h3{font-size:14px; font-weight:500}
.row span{font-size:13px; color:var(--dim); white-space:nowrap}
.sub{font-size:10px; letter-spacing:.24em; text-transform:uppercase; color:var(--dim)}

footer{
  position:relative; z-index:5; background:var(--bg);
  margin-top:clamp(90px,15vh,170px); padding:26px var(--pad);
  border-top:1px solid var(--line);
  display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap;
  font-size:12px; color:var(--dim); letter-spacing:.05em;
}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
/* ══ НАСТРОЙКИ ═══════════════════════════════════════════
   videoEnd  — на каком % скролла видео доигрывает
   markIn/Out— когда проявляется NEVERLAND
   ease      — плавность (меньше = инертнее)              */
const CFG = { videoEnd:.76, markIn:.78, markOut:.94, ease:.16 };

const SRC = ["frames/f001.webp", "frames/f002.webp", "frames/f003.webp", "frames/f004.webp", "frames/f005.webp", "frames/f006.webp", "frames/f007.webp", "frames/f008.webp", "frames/f009.webp", "frames/f010.webp", "frames/f011.webp", "frames/f012.webp", "frames/f013.webp", "frames/f014.webp", "frames/f015.webp", "frames/f016.webp", "frames/f017.webp", "frames/f018.webp", "frames/f019.webp", "frames/f020.webp", "frames/f021.webp", "frames/f022.webp", "frames/f023.webp", "frames/f024.webp", "frames/f025.webp", "frames/f026.webp", "frames/f027.webp", "frames/f028.webp", "frames/f029.webp", "frames/f030.webp", "frames/f031.webp", "frames/f032.webp", "frames/f033.webp", "frames/f034.webp", "frames/f035.webp", "frames/f036.webp", "frames/f037.webp", "frames/f038.webp", "frames/f039.webp", "frames/f040.webp", "frames/f041.webp", "frames/f042.webp", "frames/f043.webp", "frames/f044.webp", "frames/f045.webp", "frames/f046.webp", "frames/f047.webp", "frames/f048.webp", "frames/f049.webp", "frames/f050.webp", "frames/f051.webp", "frames/f052.webp", "frames/f053.webp", "frames/f054.webp", "frames/f055.webp", "frames/f056.webp", "frames/f057.webp", "frames/f058.webp", "frames/f059.webp", "frames/f060.webp", "frames/f061.webp", "frames/f062.webp", "frames/f063.webp", "frames/f064.webp", "frames/f065.webp", "frames/f066.webp", "frames/f067.webp", "frames/f068.webp", "frames/f069.webp", "frames/f070.webp", "frames/f071.webp", "frames/f072.webp", "frames/f073.webp", "frames/f074.webp", "frames/f075.webp"];

const cv = document.getElementById('seq');
const cx = cv.getContext('2d', {alpha:false});
const stage = document.getElementById('stage');
const mark  = document.getElementById('mark');
const hint  = document.getElementById('hint');
const loader= document.getElementById('loader');
const pct   = document.getElementById('pct');

/* ── предзагрузка кадров ── */
const imgs = new Array(SRC.length);
let loaded = 0;
SRC.forEach((s,i)=>{
  const im = new Image();
  im.onload = im.onerror = ()=>{
    loaded++;
    pct.textContent = Math.round(loaded/SRC.length*100)+'%';
    if(loaded===SRC.length){ loader.classList.add('done'); draw(0); }
  };
  im.src = s; imgs[i] = im;
});

/* ── canvas: вписываем кадр целиком (фон видео чёрный,
      поэтому «поля» не видны ни на одном экране) ── */
let dpr = 1;
function resize(){
  dpr = Math.min(window.devicePixelRatio||1, 2);
  cv.width  = Math.round(cv.clientWidth  * dpr);
  cv.height = Math.round(cv.clientHeight * dpr);
  draw(cur);
}
addEventListener('resize', resize);

function draw(f){
  const im = imgs[Math.max(0, Math.min(SRC.length-1, Math.round(f)))];
  if(!im || !im.naturalWidth) return;
  const W = cv.width, H = cv.height;
  cx.fillStyle = '#000'; cx.fillRect(0,0,W,H);
  const k = Math.min(W/im.naturalWidth, H/im.naturalHeight);
  const w = im.naturalWidth*k, h = im.naturalHeight*k;
  cx.drawImage(im, (W-w)/2, (H-h)/2, w, h);
}

/* ── скролл → кадр ── */
let target = 0, cur = 0, prog = 0;
const clamp = (v,a,b)=>Math.min(Math.max(v,a),b);

function loop(){
  const r = stage.getBoundingClientRect();
  prog = clamp(-r.top / (stage.offsetHeight - innerHeight), 0, 1);

  const vp = clamp(prog / CFG.videoEnd, 0, 1);
  target = vp * (SRC.length - 1);
  cur += (target - cur) * CFG.ease;
  if(Math.abs(target-cur) > .01) draw(cur); else if(cur!==target){ cur=target; draw(cur); }

  const t = clamp((prog - CFG.markIn)/(CFG.markOut - CFG.markIn), 0, 1);
  const e = t*t*(3-2*t);
  mark.style.opacity   = e;
  mark.style.transform = `scale(${1.07 - .07*e})`;

  hint.style.opacity = Math.max(0, 1 - prog*14);
  requestAnimationFrame(loop);
}

resize();
requestAnimationFrame(loop);
