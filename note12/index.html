  :root { --ink:#FFFFFF; --dark:#0a0a0a; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; }
  body { background:var(--dark); color:var(--ink); font-family:-apple-system,sans-serif; overflow:hidden; -webkit-font-smoothing:antialiased; }

  /* видео на весь экран, НЕ размытое */
  .bg { position:fixed; inset:0; width:100%; height:100%; object-fit:cover;
        filter:grayscale(1) brightness(.5) blur(0px); transform:scale(1.06);
        transition:filter 1.2s ease; z-index:0; }
  .bg.blurred { filter:grayscale(1) brightness(.38) blur(14px); }
  .bg-shade { position:fixed; inset:0; background:rgba(10,10,10,.35); z-index:1; pointer-events:none;
        transition:background 1.2s ease; }
  .bg-shade.dim { background:rgba(10,10,10,.5); }

  /* центрируем карточку */
  .wrap { position:fixed; inset:0; z-index:3; display:flex; flex-direction:column; align-items:center; padding:0; }

  /* WALLET-КАРТОЧКА */
  .card {
    position:relative;
    width:100vw; max-width:none;
    height:62vh;
    margin-top:-5vh;               /* верхние углы уходят за экран */
    border-radius:0 0 34px 34px;   /* скруглены только нижние углы */
    overflow:hidden;
    box-shadow:0 24px 60px rgba(0,0,0,.6);
    opacity:0; transform:translateY(20px);
    transition:opacity .9s ease, transform .9s cubic-bezier(.22,.9,.3,1);
  }
  .card.show { opacity:1; transform:none; }

  /* обложка на всю карту */
  .card-cover { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:0; }
  /* лёгкая вуаль снизу для читаемости кнопок */
  .card-veil { position:absolute; inset:0; z-index:1; pointer-events:none;
    background:linear-gradient(rgba(0,0,0,.15) 0%, rgba(0,0,0,0) 30%, rgba(0,0,0,0) 55%, rgba(0,0,0,.55) 100%); }

  .card-inner { position:absolute; inset:0; z-index:2; display:flex; flex-direction:column; align-items:center; padding:calc(11vh + env(safe-area-inset-top)) 26px 30px; }

  /* титул сверху (шаг 3) */
  .titles { display:flex; flex-direction:column; align-items:center; gap:10px;
    opacity:0; transform:translateY(-16px); transition:opacity .8s ease, transform .8s cubic-bezier(.22,.9,.3,1); }
  .titles.show { opacity:1; transform:none; }
  .t-diff { width:min(56vw,190px); }
  .t-div  { width:min(44vw,150px); opacity:.85; }
  .t-know { width:min(42vw,140px); margin-top:-2px; }

  .spacer { flex:1; }

  .artist:active { color:rgba(255,255,255,.55); }

  /* круглые кнопки площадок (шаг 4) */
  .platforms-zone { flex:1; display:flex; align-items:center; justify-content:center; width:100%; padding:16px 0; }
  .platforms { display:flex; flex-direction:row; align-items:center; justify-content:center; gap:10px; width:100%; padding:0 16px;
    opacity:0; transform:translateY(18px); transition:opacity .7s ease, transform .7s cubic-bezier(.22,.9,.3,1); }
  .platforms.show { opacity:1; transform:none; }
  .pbtn { flex:1; max-width:33%; cursor:pointer; position:relative; display:block;
    transition:transform .15s, opacity .2s; }
  .pbtn img { width:100%; display:block; }
  .pbtn:active { transform:scale(.94); opacity:.8; }
  .pbtn.p-apple { transition-delay:0s; } .pbtn.p-spotify { transition-delay:.05s; } .pbtn.p-youtube { transition-delay:.1s; }


  /* ПК: квадратная карточка со скруглёнными углами по центру */
  @media (min-width: 768px) {
    .wrap { justify-content:center; padding:40px; }
    .card {
      width:min(60vh, 400px);
      height:min(60vh, 400px);
      aspect-ratio:1;
      margin-top:0;
      border-radius:28px;
      box-shadow:0 30px 90px rgba(0,0,0,.7);
    }
    .card-inner { padding:30px 30px 26px; }
    .platforms { max-width:440px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .card,.titles,.platforms { transition:none; opacity:1; transform:none; }
  }
</style>
</head>

<video class="bg" id="bg" src="krbk-bg.mp4" autoplay muted loop playsinline preload="auto" disablepictureinpicture></video>
<div class="bg-shade"></div>

<script>
  const tg = window.Telegram?.WebApp;
  if (tg) { tg.ready(); tg.expand(); tg.setHeaderColor('#0a0a0a'); tg.setBackgroundColor('#0a0a0a'); }

  const bg = document.getElementById('bg');
  bg.muted = true; bg.defaultMuted = true;
  const kick = () => bg.play().catch(()=>{});
  kick(); window.addEventListener('load', kick);
  document.addEventListener('touchstart', kick, { once:true });

  const card = document.getElementById('card');
  const platforms = document.getElementById('platforms');
  const shade = document.querySelector('.bg-shade');

  // 7 сек чистое видео → блюр + обложка → кнопки
  setTimeout(() => {
    bg.classList.add('blurred');
    shade.classList.add('dim');
    card.classList.add('show');
  }, 7000);
  setTimeout(() => platforms.classList.add('show'), 8600);

  // === учёт кликов TYRAZH ===
  const TRACK_SLUG = "kz-12";
  const CLICK_ENDPOINT = "https://ktfmjaanheowyzjrovkc.supabase.co/functions/v1/track-click";
  function logClick(platform) {
    const body = JSON.stringify({ slug: TRACK_SLUG, platform });
    try { return fetch(CLICK_ENDPOINT, { method:"POST", headers:{"content-type":"application/json"}, body, keepalive:true }).catch(()=>{}); }
    catch (_) { return Promise.resolve(); }
  }

  function openUrl(el) {
    const url = el.dataset.url, p = el.dataset.p;
    tg?.HapticFeedback?.impactOccurred('light');
    let done = false;
    const go = () => { if (done) return; done = true; if (!url || url === '#') return; tg ? tg.openLink(url) : window.open(url,'_blank'); };
    if (tg) { if (p) logClick(p); go(); }
    else if (p) { logClick(p).finally(go); setTimeout(go, 500); }
    else { go(); }
  }
  document.querySelectorAll('[data-url]').forEach(el => el.addEventListener('click', () => openUrl(el)));
</script>
