<style>
  :root {
    --ink:#050505; --paper:#EDE7DC; --blood:#5C120C; --blood-hi:#C4291E;
    --line: rgba(237,231,220,.16); --glass: rgba(5,5,5,.55);
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; }
  body {
    background:var(--ink); color:var(--paper);
    font-family:'JetBrains Mono',monospace;
    overflow:hidden; -webkit-font-smoothing:antialiased;
  }

  /* видеофон — размытый, живой */
  .bg {
    position:fixed; inset:0; width:100%; height:100%; object-fit:cover;
    filter:contrast(1.12) brightness(.5) blur(26px);
    transform:scale(1.15);
    z-index:0;
  }
  .vignette {
    position:fixed; inset:0; z-index:1; pointer-events:none;
    background:
      radial-gradient(120% 70% at 50% 0%, rgba(0,0,0,0) 0%, rgba(0,0,0,.35) 70%, rgba(0,0,0,.75) 100%),
      linear-gradient(rgba(5,5,5,.15) 0%, rgba(5,5,5,0) 26%, rgba(5,5,5,0) 55%, rgba(20,4,2,.55) 100%);
  }

  .stage {
    position:fixed; inset:0; z-index:3; display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    padding:calc(28px + env(safe-area-inset-top)) 24px calc(28px + env(safe-area-inset-bottom));
    gap:26px;
  }

  /* kicker: KRBK, флажки-полоски цитируют "II" с обложки */
  .kicker {
    display:flex; align-items:center; gap:13px;
    opacity:0; transform:translateY(-12px);
    transition:opacity .8s ease, transform .8s cubic-bezier(.22,.9,.3,1);
  }
  .kicker.show { opacity:1; transform:none; }
  .kicker .bar { width:24px; height:1px; background:var(--blood-hi); opacity:.85; }
  .kicker .name {
    font-family:'Oswald'; font-weight:700; font-size:15px; letter-spacing:.42em;
    text-transform:uppercase; color:var(--paper); padding-left:.42em;
  }

  /* обложка — плакатом, без скруглений */
  .cover {
    width:min(74vw, 320px); aspect-ratio:1; object-fit:cover; display:block;
    box-shadow:0 30px 90px rgba(0,0,0,.75), 0 0 0 1px rgba(237,231,220,.06);
    opacity:0; transform:translateY(26px) scale(.95);
    transition:opacity .9s ease, transform .9s cubic-bezier(.22,.9,.3,1);
  }
  .cover.show { opacity:1; transform:none; }

  /* кнопки площадок — квитанции с алой кромкой сверху */
  .platforms {
    width:100%; max-width:340px; display:flex; flex-direction:column; gap:9px;
    opacity:0; transform:translateY(18px);
    transition:opacity .7s ease, transform .7s cubic-bezier(.22,.9,.3,1);
  }
  .platforms.show { opacity:1; transform:none; }

  .plat {
    display:flex; align-items:center; gap:13px;
    padding:15px 18px;
    background:var(--glass);
    border:1px solid var(--line);
    border-top:2px solid var(--blood-hi);
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    cursor:pointer; position:relative; overflow:hidden;
    transition:transform .15s ease;
  }
  .plat:active { transform:scale(.97); }
  .plat .icon { width:19px; height:19px; fill:var(--paper); flex-shrink:0; opacity:.92; }
  .plat .name {
    flex:1; font-family:'JetBrains Mono'; font-weight:500; font-size:12.5px;
    letter-spacing:.16em; text-transform:uppercase; color:var(--paper);
  }
  .plat .arrow { font-size:14px; color:var(--blood-hi); opacity:.9; }
  .plat .stamp { position:absolute; inset:0; background:var(--blood-hi); opacity:0; pointer-events:none; }
  .stamp.go { animation:stampflash .5s ease forwards; }
  @keyframes stampflash { 0%{ opacity:.5; } 100%{ opacity:0; } }

  .powered {
    font-size:9px; letter-spacing:.24em; text-transform:uppercase; color:rgba(237,231,220,.4);
    opacity:0; transition:opacity 1s ease;
  }
  .powered.show { opacity:1; }

  @media (prefers-reduced-motion: reduce) {
    .kicker,.cover,.platforms,.powered { transition:none; opacity:1; transform:none; }
  }
</style>
</head>

      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0C5.376 0 0 5.376 0 12s5.376 12 12 12 12-5.376 12-12S18.624 0 12 0zm0 19.104c-3.924 0-7.104-3.18-7.104-7.104S8.076 4.896 12 4.896s7.104 3.18 7.104 7.104-3.18 7.104-7.104 7.104zm0-13.332c-3.432 0-6.228 2.796-6.228 6.228S8.568 18.228 12 18.228s6.228-2.796 6.228-6.228S15.432 5.772 12 5.772zM9.684 15.54V8.46L15.816 12l-6.132 3.54z"/></svg>
      <span class="name">YouTube Music</span><span class="arrow">→</span>
      <span class="stamp"></span>
    </div>
  </div>

  <div class="powered" id="powered">Powered by zvdsk</div>
</div>

<script>
  const tg = window.Telegram?.WebApp;
  if (tg) { tg.ready(); tg.expand(); tg.setHeaderColor('#050505'); tg.setBackgroundColor('#050505'); }

  const bg = document.getElementById('bg');
  bg.muted = true; bg.defaultMuted = true;
  const kick = () => bg.play().catch(() => {});
  kick();
  window.addEventListener('load', kick);
  document.addEventListener('touchstart', kick, { once:true });

  // раскадровка выезда
  const kicker = document.getElementById('kicker');
  const cover = document.getElementById('cover');
  const platforms = document.getElementById('platforms');
  const powered = document.getElementById('powered');
  setTimeout(() => kicker.classList.add('show'), 300);
  setTimeout(() => cover.classList.add('show'), 650);
  setTimeout(() => platforms.classList.add('show'), 1350);
  setTimeout(() => powered.classList.add('show'), 1900);

  // === учёт кликов TYRAZH ===
  const TRACK_SLUG = "kz-12";
  const CLICK_ENDPOINT = "https://ktfmjaanheowyzjrovkc.supabase.co/functions/v1/track-click";
  function logClick(platform) {
    const body = JSON.stringify({ slug: TRACK_SLUG, platform });
    try {
      return fetch(CLICK_ENDPOINT, {
        method:"POST", headers:{"content-type":"application/json"}, body, keepalive:true,
      }).catch(() => {});
    } catch (_) { return Promise.resolve(); }
  }

  function stampFlash(el) {
    const s = el.querySelector('.stamp');
    if (!s) return;
    s.classList.remove('go'); void s.offsetWidth; s.classList.add('go');
  }

  function openUrl(el) {
    const url = el.dataset.url, p = el.dataset.p;
    stampFlash(el);
    tg?.HapticFeedback?.impactOccurred('light');
    let done = false;
    const go = () => {
      if (done) return; done = true;
      if (!url || url === '#') return;
      tg ? tg.openLink(url) : window.open(url, '_blank');
    };
    if (tg) { if (p) logClick(p); go(); }
    else if (p) { logClick(p).finally(go); setTimeout(go, 500); }
    else { go(); }
  }

  document.querySelectorAll('[data-url]').forEach(el => {
    el.addEventListener('click', () => openUrl(el));
  });
</script>
</body>
</html>
